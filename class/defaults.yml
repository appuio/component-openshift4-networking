parameters:
  openshift4_networking:
    =_metadata:
      multi_tenant: true
      deprecated: true
      deprecation_notice: >-
        The functionality of this component is no longer needed.

    namespace: openshift-networking

    defaultNodeSelector:
      node-role.kubernetes.io/infra: ''

    patches:
      ip-reconciler:
        target:
          kind: CronJob
          apiVersion: batch/v1
          name: ip-reconciler
          namespace: openshift-multus
        patch:
          spec:
            jobTemplate:
              spec:
                template:
                  spec:
                    nodeSelector: ${openshift4_networking:defaultNodeSelector}
